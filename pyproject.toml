[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "robert-py"
version = "1.5.3"
authors = [
    { name = "Juan Sobalvarro", email = "sobalvarrog.juans@gmail.com" },
]
description = "A Python library to interact with RobeRT server."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pyzmq>=27.0.1",
    "protobuf>=6.33.6"
]

[dependency-groups]
dev = [
    "grpcio-tools", # compilation of proto files
    "pytest",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]

[project.urls]
Homepage = "https://juansobalvarro.github.io/robert-py/"
Repository = "https://github.com/JuanSobalvarro/robert-py"

[tool.hatch.build.targets.wheel]
packages = ["src/robert"]
